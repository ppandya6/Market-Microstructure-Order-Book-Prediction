name: Research checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-tested.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m orderbook.research --demo --output artifacts/research.json.gz
      - run: python scripts/summarize.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-research-smoke-test
          path: artifacts/
